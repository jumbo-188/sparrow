# Sparrow 配置文件

channels:
  # ========== PushPlus 渠道 ==========
  - name: pushplus
    type: pushplus
    url: http://www.pushplus.plus/send
    method: POST
    headers:
      Content-Type: application/json
    default_channel: "wechat"
    default_template: "markdown"
    default_topic: ""

  # ========== Bark 渠道 ==========
  - name: bark
    type: bark
    url: https://api.day.app/${BARK_KEY}
    method: POST
    headers:
      Content-Type: application/json
    default_group: "Sparrow"
    default_icon: ""

# ========== 消息规则 ==========
messages:
  - id: morning_greeting
    description: "早安问候"
    original_schedule: "0 8 * * *"
    channels:
      - bark
    data:
      title: "🌅 早安"
      group: "Daily"
    template: |
      早上好！
      今天是 {{ date }}
      今天也要元气满满哦 💪
    enabled: true

  - id: daily_summary
    description: "每日总结"
    original_schedule: "0 22 * * *"
    channels:
      - pushplus
    data:
      title: "📊 每日总结"
    template: |
      ## 今日总结
      今天辛苦了，明天继续加油！
    enabled: true